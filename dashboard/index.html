<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuwenturo — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../design-system/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-ivory);
      color: var(--color-dark-blue);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: var(--leading-body);
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 24px;
      background: var(--gradient-nav);
      color: #fff;
    }
    .nav-brand { font-family: var(--font-display); font-size: var(--text-h5); }
    .logout {
      padding: 0;
      border: 0;
      background: none;
      color: #fff;
      font: inherit;
      font-weight: var(--font-weight-bold);
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
    }
    .logout:focus-visible { outline: var(--stroke-focus) solid #A4A4A4; outline-offset: 3px; }
    main { padding: 32px 16px; max-width: 1280px; margin: 0 auto; }
  </style>
</head>
<body>
  <nav class="nav">
    <span class="nav-brand">Kuwenturo</span>
    <button type="button" class="logout" id="logout">Mag-log out</button>
  </nav>
  <main id="dashboard"></main>
  <script>
    document.getElementById('logout').addEventListener('click', () => {
      try { sessionStorage.removeItem('kuwenturo.session'); } catch { /* storage unavailable */ }
      window.location.href = '../login/index.html';
    });
  </script>
</body>
</html>
